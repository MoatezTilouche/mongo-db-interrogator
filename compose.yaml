name: data-pilot-backend
services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - artifacts:/app/data/artifacts
    networks:
      - data-pilot
    stop_grace_period: 30s

volumes:
  artifacts:

networks:
  data-pilot:
    name: data-pilot
